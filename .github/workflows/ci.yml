name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pyright

  test:
    name: Tests (offline, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      # No keys, no database: integration tests are deselected by default.
      - run: uv run pytest --cov --cov-report=term

  parser-eval:
    name: Parser eval (live Gemini)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]
    # Secrets are not available to pull requests from forks; the step below skips then.
    if: github.event_name != 'pull_request'
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip without a GEMINI_API_KEY secret
        if: env.GEMINI_API_KEY == ''
        run: echo "::notice::GEMINI_API_KEY secret is not set; the live parser eval is skipped."
      - uses: astral-sh/setup-uv@v7
        if: env.GEMINI_API_KEY != ''
        with:
          enable-cache: true
      - if: env.GEMINI_API_KEY != ''
        run: uv sync --locked
      - name: Run the parser eval
        if: env.GEMINI_API_KEY != ''
        run: uv run python eval/run_parser_eval.py
